# The release of a plugin of SpelaionDB, kept here once and called from every plugin's
# repository when a tag `vX.Y.Z` is pushed (SpelaionDB's ADR-042, point 6):
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#       uses: spelaion-dev/spelaiondb-plugin-template/.github/workflows/plugin-release.yml@<commit>
#
# It builds the program for the four platforms SpelaionDB ships on and publishes each archive
# with its SHA-256. **Nothing is signed and nothing here uses a secret**: SpelaionDB's
# repository pins a release by the hashes this prints, in its `plugins.toml`, and the app
# starts a plugin only while its file has the pinned hash. The release notes carry the pin in
# the form `plugins.toml` wants, so moving a pin is a copy.
#
# The program is the crate: `spelaiondb-plugin-<engine>` is the package's name, its binary's
# name and the name that is pinned. `plugin.toml`, at the root, says the protocol version, the
# engines and the lowest SpelaionDB.
name: Plugin release

on:
  workflow_call:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            # The oldest Ubuntu GitHub offers: the program then runs on any newer glibc.
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      # The program's name and version are the package's; the tag must be that version.
      - name: Read the package
        shell: bash
        run: |
          set -euo pipefail
          package=$(cargo metadata --no-deps --format-version 1 | sed -E 's/.*"packages":\[\{"name":"([^"]*)","version":"([^"]*)".*/\1 \2/')
          program=${package% *}
          version=${package#* }
          case "$program" in
            spelaiondb-plugin-*) ;;
            *) echo "the package is called $program, not spelaiondb-plugin-<engine>" >&2; exit 1 ;;
          esac
          test "v$version" = "$GITHUB_REF_NAME" || { echo "the tag is $GITHUB_REF_NAME and the package is $version" >&2; exit 1; }
          echo "PROGRAM=$program" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack the program and hash it
        shell: bash
        run: |
          set -euo pipefail
          hash() { if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
          target=${{ matrix.target }}
          out=target/$target/release
          mkdir -p dist pack
          case "$target" in
            *windows*) file=$PROGRAM.exe ;;
            *) file=$PROGRAM ;;
          esac
          cp "$out/$file" LICENSE pack/
          # A .tar.gz on every platform, Windows too: SpelaionDB unpacks one kind of archive,
          # and only the program in it.
          archive=$PROGRAM-$VERSION-$target.tar.gz
          tar -C pack -czf "dist/$archive" "$file" LICENSE
          size=$(wc -c < "dist/$archive" | tr -d ' ')
          hash "dist/$archive" > "dist/$archive.sha256"
          # This platform's table of SpelaionDB's plugins.toml.
          {
            echo "[plugin.platform.$target]"
            echo "archive = \"$archive\""
            echo "archive_sha256 = \"$(cat "dist/$archive.sha256")\""
            echo "archive_size = $size"
            echo "program_sha256 = \"$(hash "pack/$file")\""
          } > "dist/pin-$target.toml"
          cat "dist/pin-$target.toml"
          echo "$PROGRAM" > dist/program.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch what was built
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir built
      - name: Write the notes and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          program=$(cat built/x86_64-unknown-linux-gnu/program.txt)
          version=${GITHUB_REF_NAME#v}
          field() { grep -m1 "^$1 = " plugin.toml | sed -E "s/^$1 = //"; }
          {
            echo "The pin of this release, for SpelaionDB's \`plugins.toml\`:"
            echo
            echo '```toml'
            echo "[[plugin]]"
            echo "name = \"$program\""
            echo "repository = \"$GITHUB_REPOSITORY\""
            echo "version = \"$version\""
            echo "protocol = $(field protocol)"
            echo "engines = $(field engines)"
            echo "min_app = $(field min_app)"
            for pin in built/*/pin-*.toml; do
              echo
              cat "$pin"
            done
            echo '```'
          } > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" --title "$program $version" --notes-file notes.md \
            built/*/*.tar.gz built/*/*.sha256
