# The checks of a plugin of SpelaionDB, kept here once and called from every plugin's
# repository (SpelaionDB's ADR-042, point 6):
#
#   jobs:
#     ci:
#       uses: spelaion-dev/spelaiondb-plugin-template/.github/workflows/plugin-ci.yml@<commit>
#
# A plugin calls it by commit, never by branch: a change here reaches a plugin when that
# plugin's repository moves the commit, in a pull request of its own.
#
# Nothing here uses a secret. The actions are pinned to a commit and Rust to a version: the
# same ones as SpelaionDB's repository. Move them there first.
#
# A plugin whose tests need a server keeps how to start it in its own repository: an
# executable `ci/services.sh` (run on Linux before the tests; Docker is there) and, for the
# variables its tests read, the `test-env` input. One with tests `cargo test` does not reach
# (a patched library's own) runs them from an executable `ci/more-tests.sh`.
name: Plugin CI

on:
  workflow_call:
    inputs:
      test-env:
        description: >-
          Variables for the tests on Linux, one NAME=value per line (where the servers
          `ci/services.sh` started are). The Windows job does not get them: its tests that
          need a server are skipped, saying so.
        type: string
        default: ""
      windows:
        description: Run clippy and the tests on Windows too.
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux · fmt, clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start what the tests need
        run: |
          if [ -x ci/services.sh ]; then ci/services.sh; else echo "no ci/services.sh: nothing to start"; fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: The tests' variables
        env:
          TEST_ENV: ${{ inputs.test-env }}
        run: |
          # Only lines that are NAME=value: nothing else reaches the environment.
          printf '%s\n' "$TEST_ENV" | grep -E '^[A-Z_][A-Z0-9_]*=' >> "$GITHUB_ENV" || true
      # The engine's own tests and the conformance set, which starts the plugin's program.
      - run: cargo test --locked
      # What `cargo test` does not reach: the tests of a patched library under vendor/, which
      # is a crate of its own.
      - name: The plugin's other tests
        run: |
          if [ -x ci/more-tests.sh ]; then ci/more-tests.sh; else echo "no ci/more-tests.sh: nothing more to run"; fi

  windows:
    name: Windows · clippy and tests
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  deny:
    name: Licenses and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
